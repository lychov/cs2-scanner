name: Debug data samples

on:
  push:
    paths: [".github/workflows/debug.yml", "debug.mjs"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node debug.mjs
      - run: node scanner.mjs || true
      - name: Commit samples to debug branch
        run: |
          mkdir -p /tmp/out && cp -r debug-out/* /tmp/out/ && cp public/data.json /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan debug && git rm -rqf . && cp -r /tmp/out/* .
          git add -A && git commit -qm "debug samples" && git push -f origin debug
